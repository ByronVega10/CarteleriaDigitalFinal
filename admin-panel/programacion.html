<!-- programacion.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programación</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- 🔹 Sidebar dinámico -->
<div id="sidebar-container"></div>

<script>
    // Insertar el sidebar igual que en todas las demás páginas
    fetch("sidebar.html")
        .then(res => res.text())
        .then(html => document.getElementById("sidebar-container").innerHTML = html);
</script>

<!-- 🔹 Contenido principal (desplazado a la derecha) -->
<div class="contenido">

    <h1>Programación de Pantallas</h1>

    <main class="page">

        <div class="form-section">
            <label>Pantalla:</label>
            <select id="selectPantalla">
                <!-- JS cargará pantallas -->
            </select>

            <label>Playlist:</label>
            <select id="selectPlaylist">
                <!-- JS cargará playlists -->
            </select>

            <button class="btn-primary" onclick="assignPlaylist()">
                Asignar
            </button>
        </div>

        <br />

        <table>
            <thead>
                <tr>
                    <th>Pantalla</th>
                    <th>Playlist Asignada</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="programacion-list">
                <!-- Asignaciones cargadas dinámicamente -->
            </tbody>
        </table>

    </main>

</div> <!-- cierre .contenido -->

<script src="app.js"></script>

</body>
</html>
